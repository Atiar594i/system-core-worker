<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>⚡ ATIAR SMS - Live OTP Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070a13;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --card-border-glow: #38bdf8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.35);
      --warning: #f59e0b;
      --warning-glow: rgba(245, 158, 11, 0.35);
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dark: #64748b;
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(245, 158, 11, 0.07) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px 10px 100px 10px; /* bottom padding for sticky mobile bar */
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* Header Bar */
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-title h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: -0.01em;
    }

    .brand-title p {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .dot-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
      animation: pulseAnim 1.4s infinite;
    }

    @keyframes pulseAnim {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    .badge-keyword {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      cursor: pointer;
    }

    /* Action Controls Card */
    .controls-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .controls-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .keyword-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 220px;
    }

    .keyword-input-wrap input {
      flex: 1;
      background: #090e1a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    .keyword-input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    /* Buttons */
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
      min-height: 40px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: #38bdf8;
      color: #fff;
    }

    .btn-toggle {
      background: #0f172a;
      border-color: #334155;
      color: var(--text-muted);
    }

    .btn-toggle.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.25);
    }

    /* Big Hero Force Fetch Button */
    .btn-hero-force {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      border: 1px solid #fbbf24;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 0 6px 20px var(--warning-glow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
      min-height: 52px;
    }

    .btn-hero-force:active {
      transform: scale(0.98);
      filter: brightness(1.1);
    }

    .btn-hero-force.fetching {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      pointer-events: none;
      opacity: 0.9;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toggle Strip */
    .toggle-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .toggle-chip {
      background: #090e1a;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .toggle-chip.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: #38bdf8;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Feed Status Info */
    .feed-header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 4px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .feed-count-badge {
      font-size: 0.85rem;
      font-weight: 700;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feed-latency-badge {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    /* Cards Feed */
    #feed-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Mobile-Optimized SMS Card */
    .sms-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
      animation: fadeInCard 0.25s ease-out;
    }

    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sms-card.new-pulse {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.4);
    }

    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .country-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #f1f5f9;
      border: 1px solid #334155;
    }

    .time-tag {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-dark);
      background: #090e1a;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* Phone Number Row */
    .number-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #090e1a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 10px;
      gap: 10px;
    }

    .number-val {
      font-size: 1.25rem;
      font-weight: 800;
      font-family: var(--font-mono);
      color: #ffffff;
      letter-spacing: 0.03em;
      word-break: break-all;
    }

    .btn-touch-copy {
      background: #1e293b;
      border: 1px solid #475569;
      color: #38bdf8;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      min-height: 42px;
      transition: all 0.15s;
    }

    .btn-touch-copy:active {
      transform: scale(0.95);
    }

    .btn-touch-copy.copied {
      background: #10b981 !important;
      border-color: #10b981 !important;
      color: #fff !important;
    }

    /* Hero OTP Box */
    .otp-hero-box {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.15) 0%, rgba(15, 23, 42, 0.8) 100%);
      border: 2px dashed #0284c7;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 12px rgba(2, 132, 199, 0.15);
    }

    .otp-label-group {
      display: flex;
      flex-direction: column;
    }

    .otp-badge-text {
      font-size: 0.68rem;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .otp-digits {
      font-size: 1.6rem;
      font-weight: 800;
      font-family: var(--font-mono);
      color: #38bdf8;
      letter-spacing: 0.15em;
      text-shadow: 0 0 14px var(--accent-glow);
    }

    .btn-otp-copy {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid #38bdf8;
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 800;
      padding: 9px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 12px rgba(2, 132, 199, 0.35);
      min-height: 44px;
      transition: all 0.15s;
    }

    .btn-otp-copy:active {
      transform: scale(0.95);
    }

    .btn-otp-copy.copied {
      background: #10b981 !important;
      border-color: #10b981 !important;
      color: #fff !important;
    }

    /* Message Box */
    .msg-preview-box {
      background: #090e1a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .msg-text {
      flex: 1;
      word-break: break-word;
    }

    /* Empty State */
    .empty-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px dashed #334155;
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
    }

    .empty-card .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty-card h3 {
      font-size: 1.1rem;
      color: #e2e8f0;
      margin-bottom: 6px;
    }

    .empty-card p {
      font-size: 0.82rem;
      color: var(--text-dark);
      max-width: 380px;
      margin: 0 auto 16px auto;
    }

    /* Sticky Bottom Thumb Bar for Mobile */
    .mobile-sticky-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(7, 10, 19, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)) 14px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.6);
    }

    .mobile-sticky-bar .btn-hero-force {
      flex: 1;
      margin: 0;
    }

    .sticky-mini-btn {
      width: 50px;
      height: 52px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .sticky-mini-btn.active {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 16px var(--accent-glow);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2000;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
    }

    @media (min-width: 769px) {
      .mobile-sticky-bar {
        display: none; /* Hide floating bar on big screens since top hero button is large */
      }
      body {
        padding-bottom: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Toast -->
  <div id="toast">
    <span id="toast-icon">⚡</span>
    <span id="toast-msg">Updated</span>
  </div>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand-group">
        <div class="brand-icon">⚡</div>
        <div class="brand-title">
          <h1>ATIAR SMS</h1>
          <p>High-Speed Live OTP Hub</p>
        </div>
      </div>
      <div class="header-pills">
        <span class="badge-status">
          <span class="dot-pulse"></span>
          <span id="status-label">Online</span>
        </span>
        <span id="badge-kw" class="badge-keyword">
          🔍 <span id="badge-kw-text">Telegram</span>
        </span>
      </div>
    </header>

    <!-- Controls & Big Force Button -->
    <div class="controls-card">
      <div class="controls-top">
        <div class="keyword-input-wrap">
          <input type="text" id="kw-input" value="Telegram" placeholder="Search keyword (e.g. Telegram)...">
          <button id="btn-save-kw" class="btn btn-primary">Set</button>
        </div>
        <div style="display:flex; gap:6px;">
          <button id="btn-autocopy-toggle" class="btn btn-toggle active">
            📋 Auto-Copy OTP: ON
          </button>
          <button id="btn-sound-toggle" class="btn btn-toggle active">
            🔔 Sound: ON
          </button>
        </div>
      </div>

      <!-- Hero Force Fetch Button -->
      <button id="btn-hero-force" class="btn-hero-force">
        <span class="icon">⚡</span>
        <span id="btn-hero-text">FORCE FETCH NOW (১ সেকেন্ডে রিফ্রেশ)</span>
      </button>

      <!-- Quick Chips -->
      <div class="toggle-strip">
        <span style="font-size:0.75rem; color:#64748b; font-weight:700;">QUICK KEYWORD:</span>
        <span class="toggle-chip active" data-kw="Telegram">Telegram</span>
        <span class="toggle-chip" data-kw="WhatsApp">WhatsApp</span>
        <span class="toggle-chip" data-kw="Google">Google</span>
        <span class="toggle-chip" data-kw="TikTok">TikTok</span>
        <span class="toggle-chip" data-kw="">All</span>
      </div>
    </div>

    <!-- Feed Header Info -->
    <div class="feed-header-info">
      <div class="feed-count-badge">
        <span>📑 Reports:</span>
        <strong id="reports-count" style="color:#38bdf8;">0</strong>
      </div>
      <div id="latency-badge" class="feed-latency-badge" style="display:none;">
        ⚡ Ready
      </div>
    </div>

    <!-- Live Cards Container -->
    <div id="feed-container"></div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-card">
      <div class="icon">📡</div>
      <h3>কোনো রিপোর্ট নেই বা লোড হচ্ছে...</h3>
      <p>নিচের <strong>"FORCE FETCH NOW"</strong> বাটনে ক্লিক করলেই এক সেকেন্ডের ভেতর প্যানেল থেকে লাইভ রিপোর্ট এখানে চলে আসবে।</p>
      <button class="btn btn-primary" onclick="triggerForceFetch()">⚡ এখনি রিফ্রেশ করুন</button>
    </div>
  </div>

  <!-- Mobile Sticky Thumb Bar -->
  <div class="mobile-sticky-bar">
    <button id="btn-sticky-force" class="btn-hero-force">
      <span class="icon">⚡</span>
      <span id="btn-sticky-text">FORCE FETCH</span>
    </button>
    <button id="btn-sticky-autocopy" class="sticky-mini-btn active" title="Toggle Auto-Copy">
      📋
    </button>
    <button id="btn-sticky-sound" class="sticky-mini-btn active" title="Toggle Sound">
      🔔
    </button>
  </div>

  <script>
    let currentKeyword = 'Telegram';
    let autoCopyOtp = true;
    let soundEnabled = true;
    let isFetching = false;
    let audioCtx = null;
    let lastFetchedOtps = new Set();

    const feedContainer = document.getElementById('feed-container');
    const emptyState = document.getElementById('empty-state');
    const reportsCountEl = document.getElementById('reports-count');
    const latencyBadgeEl = document.getElementById('latency-badge');
    const kwInput = document.getElementById('kw-input');
    const badgeKwText = document.getElementById('badge-kw-text');
    const toastEl = document.getElementById('toast');
    const toastMsgEl = document.getElementById('toast-msg');

    const btnHeroForce = document.getElementById('btn-hero-force');
    const btnHeroText = document.getElementById('btn-hero-text');
    const btnStickyForce = document.getElementById('btn-sticky-force');
    const btnStickyText = document.getElementById('btn-sticky-text');

    const btnAutoCopyToggle = document.getElementById('btn-autocopy-toggle');
    const btnStickyAutoCopy = document.getElementById('btn-sticky-autocopy');
    const btnSoundToggle = document.getElementById('btn-sound-toggle');
    const btnStickySound = document.getElementById('btn-sticky-sound');

    // Chime sound
    function playChime() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.24);
      } catch (e) {}
    }

    // Haptic vibration feedback for phones
    function triggerVibrate(pattern = [40]) {
      if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    let toastTimer = null;
    function showToast(text, icon = '⚡') {
      document.getElementById('toast-icon').textContent = icon;
      toastMsgEl.textContent = text;
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    // 1-Click Clipboard Copy
    async function copyText(text, label = 'Text', btn = null) {
      triggerVibrate([30]);
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        showToast(`${label} Copied: ${text}`, '📋');
        if (btn) {
          btn.classList.add('copied');
          const orig = btn.innerHTML;
          btn.innerHTML = '✓ Copied!';
          setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = orig;
          }, 1400);
        }
        return true;
      } catch (err) {
        showToast(`Copy failed: ${err}`, '❌');
        return false;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Render Cards in Mobile-Friendly View
    function renderRecords(recordsList) {
      if (!recordsList || recordsList.length === 0) {
        feedContainer.innerHTML = '';
        emptyState.style.display = 'block';
        reportsCountEl.textContent = '0';
        return;
      }

      emptyState.style.display = 'none';
      reportsCountEl.textContent = recordsList.length;

      let html = '';
      recordsList.forEach((item, index) => {
        const flag = item.flag || '🌐';
        const country = item.country || 'Unknown';
        const callingCode = item.calling_code ? `+${item.calling_code}` : '';
        const service = item.cli || 'Telegram';
        const otp = item.otp || '';
        const number = item.number || '';
        const time = item.time || '';
        const msg = item.message || '';

        html += `
          <div class="sms-card ${index === 0 ? 'new-pulse' : ''}">
            <div class="card-meta-row">
              <span class="country-tag">${flag} ${escapeHtml(country)} ${callingCode}</span>
              <span class="time-tag">⏱️ ${escapeHtml(time)}</span>
            </div>

            <!-- Phone Number Row -->
            <div class="number-row">
              <span class="number-val">${escapeHtml(number)}</span>
              <button class="btn-touch-copy" onclick="copyText('${escapeAttr(number)}', 'Number', this)">
                📋 Copy Num
              </button>
            </div>

            <!-- OTP Hero Box (if OTP present) -->
            ${otp ? `
            <div class="otp-hero-box">
              <div class="otp-label-group">
                <span class="otp-badge-text">OTP CODE</span>
                <span class="otp-digits">${escapeHtml(otp)}</span>
              </div>
              <button class="btn-otp-copy" onclick="copyText('${escapeAttr(otp)}', 'OTP Code', this)">
                📋 COPY CODE
              </button>
            </div>` : ''}

            <!-- SMS Message Row -->
            <div class="msg-preview-box">
              <div class="msg-text">${escapeHtml(msg)}</div>
              <button class="btn-touch-copy" style="min-height:36px; padding:4px 8px; font-size:0.75rem;" onclick="copyText('${escapeAttr(msg)}', 'SMS', this)">
                Copy SMS
              </button>
            </div>
          </div>
        `;
      });

      feedContainer.innerHTML = html;
    }

    // ⚡ INSTANT FORCE FETCH
    async function triggerForceFetch() {
      if (isFetching) return;
      isFetching = true;
      triggerVibrate([40]);

      // UI fetching state
      btnHeroForce.classList.add('fetching');
      btnHeroText.innerHTML = '<span class="spinner"></span> <span>১ সেকেন্ডে সার্চ হচ্ছে...</span>';
      btnStickyForce.classList.add('fetching');
      btnStickyText.innerHTML = '<span class="spinner"></span>';

      try {
        const kw = currentKeyword.trim();
        const url = `/api/force_fetch?keyword=${encodeURIComponent(kw)}&limit=25`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.success && data.records) {
          renderRecords(data.records);

          // Latency badge
          if (data.latency_ms !== undefined) {
            latencyBadgeEl.style.display = 'inline-block';
            latencyBadgeEl.textContent = `⚡ ${data.latency_ms}ms (${data.count} found)`;
          }

          // Check if newest record has OTP
          if (data.records.length > 0) {
            const newest = data.records[0];
            if (newest.otp && !lastFetchedOtps.has(newest.otp)) {
              lastFetchedOtps.add(newest.otp);
              playChime();
              triggerVibrate([60, 40, 60]);

              if (autoCopyOtp) {
                copyText(newest.otp, 'New OTP Code');
              }
            }
          }

          showToast(`⚡ ${data.count || 0}টি রিপোর্ট আপডেট হয়েছে! (${data.latency_ms || 250}ms)`, '⚡');
        } else {
          showToast('রিপোর্ট পাওয়া যায়নি', '⚠️');
        }
      } catch (err) {
        showToast(`সার্চে সমস্যা: ${err}`, '❌');
      } finally {
        isFetching = false;
        btnHeroForce.classList.remove('fetching');
        btnHeroText.innerHTML = 'FORCE FETCH NOW (১ সেকেন্ডে রিফ্রেশ)';
        btnStickyForce.classList.remove('fetching');
        btnStickyText.innerHTML = 'FORCE FETCH';
      }
    }

    // Attach listeners
    btnHeroForce.addEventListener('click', triggerForceFetch);
    btnStickyForce.addEventListener('click', triggerForceFetch);

    // Keyword update
    function applyKeyword(kw) {
      currentKeyword = kw;
      kwInput.value = kw;
      badgeKwText.textContent = kw || 'All';
      document.querySelectorAll('.toggle-chip').forEach(ch => {
        ch.classList.toggle('active', ch.getAttribute('data-kw') === kw);
      });
      triggerForceFetch();
    }

    document.getElementById('btn-save-kw').addEventListener('click', () => {
      applyKeyword(kwInput.value.trim());
    });

    kwInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') applyKeyword(kwInput.value.trim());
    });

    document.querySelectorAll('.toggle-chip').forEach(ch => {
      ch.addEventListener('click', () => {
        applyKeyword(ch.getAttribute('data-kw'));
      });
    });

    // Auto-Copy Toggle
    function toggleAutoCopy() {
      autoCopyOtp = !autoCopyOtp;
      btnAutoCopyToggle.classList.toggle('active', autoCopyOtp);
      btnAutoCopyToggle.textContent = autoCopyOtp ? '📋 Auto-Copy OTP: ON' : '📋 Auto-Copy OTP: OFF';
      btnStickyAutoCopy.classList.toggle('active', autoCopyOtp);
      showToast(autoCopyOtp ? 'Auto-Copy OTP ON' : 'Auto-Copy OFF');
      triggerVibrate([30]);
    }
    btnAutoCopyToggle.addEventListener('click', toggleAutoCopy);
    btnStickyAutoCopy.addEventListener('click', toggleAutoCopy);

    // Sound Toggle
    function toggleSound() {
      soundEnabled = !soundEnabled;
      btnSoundToggle.classList.toggle('active', soundEnabled);
      btnSoundToggle.textContent = soundEnabled ? '🔔 Sound: ON' : '🔕 Sound: OFF';
      btnStickySound.classList.toggle('active', soundEnabled);
      showToast(soundEnabled ? 'Sound ON' : 'Sound OFF');
      triggerVibrate([30]);
    }
    btnSoundToggle.addEventListener('click', toggleSound);
    btnStickySound.addEventListener('click', toggleSound);

    // Initial load: trigger quick initial fetch
    triggerForceFetch();
  </script>
</body>
</html>
